<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>LineBoy — monochrome player mockup</title>
  <style>
    @font-face {
      font-family: "Modern DOS";
      src: url("./assets/ModernDOS8x16.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --black: #080808;
      --well: #101010;
      --panel: #151515;
      --line: #696969;
      --line-bright: #a4a4a4;
      --gray: #bdbdbd;
      --white: #e8e8e8;
      --dim: #898989;
      --faint: #5e5e5e;
      --text-cell-height: 16px;
      --mono: "Modern DOS", "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html, body { min-width: 320px; min-height: 100%; margin: 0; }

    body {
      background: var(--black);
      color: var(--gray);
      font: 16px/var(--text-cell-height) var(--mono);
      letter-spacing: 0;
      -webkit-font-smoothing: none;
      text-rendering: optimizeSpeed;
    }

    button { font: inherit; letter-spacing: inherit; }

    .crt {
      min-height: 100vh;
      padding: 8px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at center, transparent 72%, #0005 100%),
        var(--black);
    }

    .terminal {
      width: var(--video-width, 1024px);
      height: var(--video-height, 768px);
      zoom: var(--video-scale, 1);
      min-height: 0;
      margin: 0 auto;
      padding: 8px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 8px;
      position: relative;
      isolation: isolate;
      background: #0b0b0b;
    }

    .terminal > header,
    .terminal > nav,
    .terminal > main,
    .terminal > footer {
      min-width: 0;
      opacity: 0;
    }

    .beam-screen {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      pointer-events: none;
    }

    .terminal[data-renderer="dom"] > header,
    .terminal[data-renderer="dom"] > nav,
    .terminal[data-renderer="dom"] > main,
    .terminal[data-renderer="dom"] > footer {
      opacity: 1;
    }

    .terminal[data-renderer="dom"] .beam-screen {
      display: none;
    }

    .terminal[data-renderer="webgl2"] > header,
    .terminal[data-renderer="webgl2"] > nav,
    .terminal[data-renderer="webgl2"] > main,
    .terminal[data-renderer="webgl2"] > footer {
      opacity: 0;
    }

    .terminal[data-renderer="webgl2"] .beam-screen {
      display: block;
    }

    .topline, .toolrow, .statusline, .panel-title, .tabs, .playerline {
      display: flex;
      align-items: center;
    }

    .topline {
      min-height: 48px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: 16px 16px;
      align-content: start;
      gap: 0 8px;
      border-bottom: 1px solid var(--line);
      padding: 0 2px 6px;
      text-transform: uppercase;
    }

    .brand-lockup, .sysinfo, .statbits { display: flex; align-items: center; gap: 8px; }
    .brand-lockup { grid-column: 1; grid-row: 1; }
    .sysinfo { grid-column: 1 / -1; grid-row: 2; }
    .statbits { grid-column: 2; grid-row: 1; }
    .brand { color: var(--white); font-size: 16px; font-weight: 800; letter-spacing: .06em; white-space: nowrap; }
    .brand span { color: var(--dim); font-size: 16px; font-weight: 500; letter-spacing: 0; }
    .lamp { display: inline-block; width: 7px; height: 7px; margin-right: 7px; background: var(--gray); }
    .sysinfo, .statbits { color: var(--dim); font-size: 16px; white-space: nowrap; }
    .statbits strong { color: var(--gray); font-weight: 600; }
    .mode-switch {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--gray);
      text-align: left;
      cursor: pointer;
    }
    .mode-switch:hover, .mode-switch:focus-visible { color: var(--white); text-decoration: underline; }

    .toolrow { gap: 2px; flex-wrap: wrap; }

    .key {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 3px;
      border: 1px solid var(--line-bright);
      background: var(--gray);
      color: var(--black);
      text-transform: uppercase;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: inset 0 1px #eee, inset 0 -1px #777;
      white-space: nowrap;
    }

    .key kbd { color: #454545; font: 16px/16px var(--mono); }
    .key:hover, .key[aria-pressed="true"] { background: var(--white); }
    .key.clear {
      background: transparent;
      color: var(--gray);
      box-shadow: none;
    }
    .key.clear kbd { color: var(--dim); }
    .key.clear:hover, .key.clear[aria-pressed="true"] {
      background: var(--gray);
      color: var(--black);
    }

    .workspace {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(150px, 26%) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      gap: 4px;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      background: var(--well);
    }

    .panel-title {
      min-height: 16px;
      justify-content: space-between;
      gap: 8px;
      padding: 0 4px;
      background: var(--gray);
      color: var(--black);
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .panel-title > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .panel-title small { color: #505050; font: 16px/16px var(--mono); white-space: nowrap; }

    .filterline {
      min-height: 17px;
      padding: 0 6px;
      border-bottom: 1px solid #363636;
      color: var(--dim);
      font-size: 16px;
      overflow: hidden;
      white-space: nowrap;
    }
    .filterline b { color: var(--white); font-weight: 600; }

    .tree {
      display: grid;
      gap: 0;
      align-content: start;
      padding: 4px;
      overflow: auto;
    }

    .tree-row {
      min-width: 0;
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto;
      align-items: center;
      gap: 2px;
      min-height: 16px;
      padding: 0 2px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--gray);
      text-align: left;
      cursor: pointer;
    }
    .tree-row .chev { color: var(--dim); }
    .tree-row small { color: var(--dim); font-size: 16px; }
    .tree-row > span:nth-child(2) { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-row:hover { border-color: var(--line); }
    .tree-row[aria-selected="true"] {
      background: var(--gray);
      color: var(--black);
    }
    .tree-row[aria-selected="true"] .chev,
    .tree-row[aria-selected="true"] small { color: #444; }
    .tree-row.indent { padding-left: 19px; }

    .listpanel { overflow: hidden; }
    .tabs { min-height: 24px; gap: 4px; padding: 2px 4px; border-bottom: 1px solid #393939; }
    .tab {
      min-height: 20px;
      padding: 1px 4px;
      border: 1px solid var(--line);
      color: var(--dim);
      font-size: 16px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab.active { border-color: var(--gray); color: var(--white); }
    .tab.add { margin-left: auto; color: var(--gray); }

    .list-head, .song {
      display: grid;
      grid-template-columns: 28px minmax(120px, 1.8fr) minmax(72px, 1fr) 64px 44px;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
    }

    .list-head {
      min-height: 16px;
      border-bottom: 1px solid var(--line);
      color: var(--dim);
      font-size: 16px;
      text-transform: uppercase;
    }
    .list-head span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list-head span:last-child, .song span:last-child { text-align: right; }

    .songs { flex: 1; min-height: 0; overflow: auto; padding: 2px 4px 6px; }
    .song {
      width: 100%;
      min-height: 16px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--gray);
      text-align: left;
      cursor: pointer;
    }
    .song .num, .song .album, .song .length { color: var(--dim); }
    .song:hover { border-color: var(--line); }
    .song[aria-selected="true"] { background: var(--gray); color: var(--black); }
    .song[aria-selected="true"] .num,
    .song[aria-selected="true"] .album,
    .song[aria-selected="true"] .length { color: #454545; }
    .song span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .playerline {
      min-height: 32px;
      gap: 8px;
      padding: 5px 7px;
      border-top: 1px solid var(--line);
      background: #0b0b0b;
    }
    .playerline .now { min-width: 170px; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--white); }
    .playerline .time { color: var(--dim); font-size: 16px; }
    .meter { width: min(160px, 20vw); height: 7px; border: 1px solid var(--line); background: #080808; }
    .meter i { display: block; width: 38%; height: 100%; background: var(--gray); }

    .statusline {
      min-width: 0;
      min-height: 16px;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px 0;
      border-top: 1px solid var(--line);
      color: var(--dim);
      font-size: 16px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .statusline strong { color: var(--gray); font-weight: 600; }
    .statusline > span:first-child,
    .statusline > span:last-child { flex: 0 0 auto; }
    .statusline #status { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

    .terminal[data-video-mode="standard"] .list-head,
    .terminal[data-video-mode="standard"] .song {
      grid-template-columns: 28px minmax(105px, 1.8fr) minmax(70px, 1fr) 54px 36px;
      gap: 3px;
      padding-inline: 4px;
    }

    @media (max-width: 760px) {
      .sysinfo { gap: 8px; flex-wrap: wrap; }
      .workspace { grid-template-columns: 1fr; grid-template-rows: minmax(120px, 34%) minmax(0, 1fr); }
      .tree { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .list-head, .song { grid-template-columns: 27px minmax(130px, 1.8fr) minmax(75px, 1fr) 60px; }
      .list-head span:nth-child(4), .song span:nth-child(4) { display: none; }
      .terminal { padding: 8px; }
      .playerline { flex-wrap: wrap; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .key, .tree-row, .song { transition: background-color 90ms linear, color 90ms linear; }
    }

    /* Standard LineBoy is a 40-column text raster with no fractional chrome. */
    .terminal {
      padding: 8px;
      grid-template-rows: 16px 16px minmax(0, 1fr) 16px;
      gap: 0;
    }

    .topline {
      min-height: 16px;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: 16px;
      align-content: center;
      border-bottom: 1px solid var(--line);
      padding: 0;
      gap: 0;
    }

    .brand-lockup, .statbits { grid-row: 1; gap: 1ch; }
    .brand-lockup { grid-column: 1; }
    .statbits { grid-column: 2; justify-content: flex-end; }
    .sysinfo, .lamp { display: none; }
    .brand { font-size: 16px; letter-spacing: 0; }
    .mode-switch { font: inherit; }

    .toolrow {
      min-height: 16px;
      display: grid;
      grid-template-columns: 5ch 5ch 5ch 4ch 5ch minmax(0, 1fr) 3ch 5ch 3ch;
      gap: 0;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
    }

    .key {
      min-width: 0;
      min-height: 16px;
      height: 16px;
      justify-content: flex-start;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--gray);
      box-shadow: none;
      font-size: 16px;
      font-weight: 400;
      line-height: 16px;
      text-align: left;
    }

    .key kbd { display: none; }
    .key:hover, .key[aria-pressed="true"] {
      background: var(--gray);
      color: var(--black);
      text-decoration: none;
    }

    .workspace {
      min-width: 0;
      min-height: 0;
      grid-template-columns: 14ch minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      gap: 0;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      border: 0;
      background: transparent;
    }

    .panel:first-child {
      border-right: 1px solid var(--line);
      padding-right: 1ch;
    }

    .listpanel { padding-left: 1ch; }

    .panel-title {
      min-height: 16px;
      height: 16px;
      justify-content: space-between;
      gap: 1ch;
      padding: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--white);
      font-size: 16px;
      line-height: 16px;
    }

    .panel-title > span, .panel-title small {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel-title small { color: var(--dim); font: inherit; }

    .filterline {
      min-height: 16px;
      height: 16px;
      padding: 0;
      border: 0;
      color: var(--dim);
      font-size: 16px;
      line-height: 16px;
    }

    .tree {
      min-height: 0;
      gap: 0;
      padding: 0;
      grid-template-columns: minmax(0, 1fr);
      overflow: hidden;
    }

    .tree-row {
      min-width: 0;
      min-height: 16px;
      height: 16px;
      grid-template-columns: 2ch minmax(0, 1fr) 3ch;
      gap: 0;
      padding: 0;
      border: 0;
      color: var(--gray);
      font-size: 16px;
      line-height: 16px;
    }

    .tree-row.indent { padding-left: 2ch; }
    .tree-row small { font: inherit; color: var(--dim); text-align: right; }
    .tree-row[aria-selected="true"] { background: var(--gray); color: var(--black); }
    .tree-row[aria-selected="true"] .chev,
    .tree-row[aria-selected="true"] small { color: #454545; }

    .tabs {
      min-height: 16px;
      height: 16px;
      gap: 0;
      padding: 0;
      border: 0;
      overflow: hidden;
    }

    .tab {
      min-width: 0;
      min-height: 16px;
      height: 16px;
      padding: 0 1ch 0 0;
      border: 0;
      color: var(--dim);
      font-size: 16px;
      line-height: 16px;
      white-space: nowrap;
    }

    .tab.active { background: var(--gray); color: var(--black); }
    .tab.add { margin-left: auto; padding: 0; }

    .list-head, .song {
      grid-template-columns: 2ch minmax(0, 1fr) 5ch;
      align-items: center;
      gap: 1ch;
      padding: 0 1ch;
    }

    .list-head {
      min-height: 16px;
      height: 16px;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
      line-height: 16px;
    }

    .song .album, .song span:last-child { display: none; }

    .list-head span:nth-child(3), .song .length { grid-column: 3; }

    .songs { min-height: 0; padding: 0; }

    .song {
      min-height: 16px;
      height: 16px;
      border: 0;
      color: var(--gray);
      font-size: 16px;
      line-height: 16px;
    }

    .song .num, .song .length { color: var(--dim); }
    .song[aria-selected="true"] { background: var(--gray); color: var(--black); }
    .song[aria-selected="true"] .num, .song[aria-selected="true"] .length { color: #454545; }
    .song:hover:not([aria-selected="true"]) { text-decoration: underline; }

    .playerline { display: none; }

    .statusline {
      min-width: 0;
      min-height: 16px;
      height: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 1ch;
      padding: 0;
      border-top: 1px solid var(--line);
      font-size: 16px;
      line-height: 16px;
    }

    .statusline > span:first-child,
    .statusline > span:last-child { min-width: 0; }
    .statusline #status { overflow: hidden; text-overflow: ellipsis; }

    .terminal[data-video-mode="standard"] .workspace {
      grid-template-columns: 14ch minmax(0, 1fr);
    }

    .terminal[data-video-mode="high"] .workspace {
      grid-template-columns: 25% minmax(0, 1fr);
      gap: 1ch;
    }

    @media (max-width: 760px) {
      .terminal[data-video-mode="standard"] .workspace {
        grid-template-columns: 14ch minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
      }
      .terminal[data-video-mode="standard"] .tree { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="crt">
    <div class="terminal" data-renderer="dom" data-video-mode="standard" role="application" aria-label="LineBoy monochrome music player mockup">
      <canvas class="beam-screen" aria-hidden="true"></canvas>
      <header class="topline">
        <div class="brand-lockup"><div class="brand">LINEBOY</div></div>
        <div class="statbits">
          <span id="column-mode">40 COL</span>
          <button class="mode-switch" id="video-mode" type="button" title="Switch between the standard 320 by 240 raster and high-resolution raster modes">320X240</button>
          <span id="clock">00:00:00</span>
        </div>
      </header>

      <nav class="toolrow" aria-label="Commands and transport">
        <button class="key" data-action="OPEN">FILE</button>
        <button class="key clear" data-action="TREE">TREE</button>
        <button class="key clear" data-action="PLAYLIST">LIST</button>
        <button class="key clear" data-action="FAVORITES">FAV</button>
        <button class="key clear" data-action="OPTIONS">OPTS</button>
        <span class="tool-spacer" aria-hidden="true"></span>
        <button class="key clear" data-action="PREV">&lt;&lt;</button>
        <button class="key" data-action="PLAY">PLAY</button>
        <button class="key clear" data-action="NEXT">&gt;&gt;</button>
      </nav>

      <main class="workspace">
        <aside class="panel">
          <div class="panel-title"><span>LIBRARY</span><small>12/64</small></div>
          <div class="filterline">FIND ______</div>
          <div class="tree" role="listbox" aria-label="Library folders">
            <button class="tree-row" role="option" aria-selected="false"><span class="chev">+</span><span>AMIGA</span><small>38</small></button>
            <button class="tree-row" role="option" aria-selected="false"><span class="chev">+</span><span>ARCADE</span><small>54</small></button>
            <button class="tree-row" role="option" aria-selected="false"><span class="chev">+</span><span>ATARI ST</span><small>21</small></button>
            <button class="tree-row" role="option" aria-selected="false"><span class="chev">+</span><span>C64</span><small>17</small></button>
            <button class="tree-row" role="option" aria-selected="true"><span class="chev">−</span><span>SNES</span><small>143</small></button>
            <button class="tree-row indent" role="option" aria-selected="false"><span class="chev">›</span><span>ACTRAISER</span><small>22</small></button>
            <button class="tree-row indent" role="option" aria-selected="false"><span class="chev">›</span><span>CASTLEVANIA IV</span><small>18</small></button>
            <button class="tree-row indent" role="option" aria-selected="true"><span class="chev">›</span><span>CHRONO TRIGGER</span><small>43</small></button>
            <button class="tree-row indent" role="option" aria-selected="false"><span class="chev">›</span><span>FINAL FANTASY VI</span><small>61</small></button>
            <button class="tree-row indent" role="option" aria-selected="false"><span class="chev">›</span><span>SUPER METROID</span><small>13</small></button>
            <button class="tree-row" role="option" aria-selected="false"><span class="chev">+</span><span>SEGA GENESIS</span><small>72</small></button>
            <button class="tree-row" role="option" aria-selected="false"><span class="chev">+</span><span>SONY PLAYSTATION</span><small>29</small></button>
            <button class="tree-row" role="option" aria-selected="false"><span class="chev">+</span><span>ZX SPECTRUM</span><small>11</small></button>
          </div>
        </aside>

        <section class="panel listpanel" aria-label="Playlist">
          <div class="panel-title"><span>CHRONO TRIGGER</span><small>43 TRK</small></div>
          <div class="tabs"><span class="tab active">CHRONO</span><span class="tab">FAV</span><span class="tab">HIST</span><span class="tab add">[+]</span></div>
          <div class="list-head"><span>#</span><span>TRACK</span><span>TIME</span></div>
          <div class="songs" role="listbox" aria-label="Playlist tracks">
            <button class="song" role="option" aria-selected="false"><span class="num">01</span><span>At the Bottom of Night</span><span class="album">CHRONO TRIGGER</span><span class="length">2:13</span><span>□</span></button>
            <button class="song" role="option" aria-selected="false"><span class="num">02</span><span>Ayla's Theme</span><span class="album">CHRONO TRIGGER</span><span class="length">1:08</span><span>□</span></button>
            <button class="song" role="option" aria-selected="false"><span class="num">03</span><span>Battle 1</span><span class="album">CHRONO TRIGGER</span><span class="length">1:30</span><span>□</span></button>
            <button class="song" role="option" aria-selected="false"><span class="num">04</span><span>Battle 2</span><span class="album">CHRONO TRIGGER</span><span class="length">1:13</span><span>□</span></button>

      <footer class="statusline"><span id="status">C:\SNES\CHRONO\BLACKBIRD.SPC</span><span id="now">STOPPED</span></footer>

  </div>
  <script>
    const VIDEO_MODE_VARIANTS = {
      STANDARD: [
        { id: "STANDARD", name: "320X240", width: 320, height: 240, deviceScale: 6 },
        { id: "STANDARD", name: "320X240", width: 320, height: 240, deviceScale: 4 },
        { id: "STANDARD", name: "320X240", width: 320, height: 240, deviceScale: 2 },
      ],
      HIGH: [
        { id: "HIGH", name: "XGA", width: 1024, height: 768, deviceScale: 2 },
        { id: "HIGH", name: "SVGA", width: 800, height: 600, deviceScale: 2 },
        { id: "HIGH", name: "VGA", width: 640, height: 480, deviceScale: 2 },
        { id: "HIGH", name: "EGA", width: 512, height: 384, deviceScale: 2 },
      ],
    };
    const terminal = document.querySelector(".terminal");
    const display = document.querySelector(".beam-screen");
    const videoModeLabel = document.querySelector("#video-mode");
    const columnModeLabel = document.querySelector("#column-mode");
    let activeVideoMode = null;
    let requestedVideoMode = "STANDARD";
    let activeScanPitchCss = 1;
    let screenOriginY = 0;

    function updateVideoMode() {
      const deviceRatio = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
      const availableWidth = (window.innerWidth - 16) * deviceRatio;
      const availableHeight = (window.innerHeight - 16) * deviceRatio;
      const nextMode = VIDEO_MODE_VARIANTS[requestedVideoMode].find((mode) =>
        mode.width * mode.deviceScale <= availableWidth
          && mode.height * mode.deviceScale <= availableHeight
      ) || VIDEO_MODE_VARIANTS[requestedVideoMode].at(-1);
      nextMode.scale = nextMode.deviceScale / deviceRatio;
      if (activeVideoMode?.id === nextMode.id
          && activeVideoMode?.width === nextMode.width
          && activeVideoMode?.height === nextMode.height
          && activeVideoMode?.deviceScale === nextMode.deviceScale
          && activeVideoMode?.scale === nextMode.scale) {
        return false;
      }

      activeVideoMode = nextMode;
      terminal.dataset.videoMode = nextMode.id.toLowerCase();
      terminal.style.setProperty("--video-width", `${nextMode.width}px`);
      terminal.style.setProperty("--video-height", `${nextMode.height}px`);
      terminal.style.setProperty("--video-scale", nextMode.scale);
      videoModeLabel.textContent = nextMode.name;
      videoModeLabel.setAttribute("aria-label",
        `${nextMode.width} by ${nextMode.height} ${requestedVideoMode.toLowerCase()} raster at ${nextMode.deviceScale} device pixels per source pixel`);
      columnModeLabel.textContent = `${Math.floor(nextMode.width / 8)} COL`;
      return true;
    }

    updateVideoMode();
    videoModeLabel.addEventListener("click", () => {
      requestedVideoMode = requestedVideoMode === "STANDARD" ? "HIGH" : "STANDARD";
      updateVideoMode();
      scheduleRender();
    });
    const gl = display.getContext("webgl2", {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      preserveDrawingBuffer: true,
    });

    const vertexSource = `#version 300 es
      in vec2 a_position;
      out vec2 v_uv;
      void main() {
        v_uv = a_position * 0.5 + 0.5;
        gl_Position = vec4(a_position, 0.0, 1.0);
      }
    `;

    const fragmentSource = `#version 300 es
      precision highp float;
      uniform sampler2D u_frame;
      uniform vec2 u_resolution;
      uniform float u_scan_pitch;
      in vec2 v_uv;
      out vec4 out_color;

      void main() {
        vec3 source = texture(u_frame, v_uv).rgb;
        vec3 linear_source = pow(max(source, vec3(0.0)), vec3(2.2));
        float level = dot(linear_source, vec3(0.2126, 0.7152, 0.0722));

        // Draw one focused beam spot per fixed raster interval. The hard
        // coverage edge leaves a true black phosphor gap; source pixels outside
        // the beam spot do not leak through as gray.
        float screen_y = u_resolution.y - gl_FragCoord.y;
        float center_offset = (u_scan_pitch - 1.0) * 0.5;
        float phase = mod(screen_y - center_offset + u_scan_pitch * 0.5, u_scan_pitch)
          - u_scan_pitch * 0.5;
        float max_beam_fraction = u_scan_pitch > 2.5 ? 0.30 : 0.34;
        float beam_radius = u_scan_pitch * mix(0.27, max_beam_fraction, sqrt(level));
        float edge = u_scan_pitch * 0.018;
        float distance_from_center = abs(phase);
        float coverage = 1.0 - smoothstep(beam_radius - edge, beam_radius + edge, distance_from_center);
        float spot = exp(-0.5 * pow(distance_from_center / (beam_radius * 0.72), 2.0));

        if (coverage <= 0.0) {
          out_color = vec4(0.0, 0.0, 0.0, 1.0);
          return;
        }

        vec3 emitted = linear_source * spot * coverage;
        vec3 encoded = pow(clamp(emitted, 0.0, 1.0), vec3(1.0 / 2.2));
        out_color = vec4(encoded, 1.0);
      }
    `;

    const compileShader = (type, source) => {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const detail = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(detail || "Unable to compile the CRT beam shader");
      }
      return shader;
    };

    let program = null;
    let texture = null;
    let frameRequest = 0;
    let renderVersion = 0;
    const framebuffer = document.createElement("canvas");
    const framebufferContext = framebuffer.getContext("2d", { alpha: false });

    if (gl) {
      try {
        const vertexShader = compileShader(gl.VERTEX_SHADER, vertexSource);
        const fragmentShader = compileShader(gl.FRAGMENT_SHADER, fragmentSource);
        program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        gl.deleteShader(vertexShader);
        gl.deleteShader(fragmentShader);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(program) || "Unable to link the CRT beam shader");
        }

        const vertices = new Float32Array([-1, -1, 3, -1, -1, 3]);
        const vertexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.useProgram(program);
        const position = gl.getAttribLocation(program, "a_position");
        gl.enableVertexAttribArray(position);
        gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

        texture = gl.createTexture();
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.uniform1i(gl.getUniformLocation(program, "u_frame"), 0);
      } catch (error) {
        console.error("LineBoy CRT renderer unavailable:", error);
        terminal.dataset.renderer = "dom";
      }
    } else {
      terminal.dataset.renderer = "dom";
    }

    function scheduleRender() {
      if (!gl || !program || frameRequest) return;
      frameRequest = requestAnimationFrame(() => {
        frameRequest = 0;
        renderFrame();
      });
    }

    function renderFrame() {
      const version = ++renderVersion;
      const rect = terminal.getBoundingClientRect();
      if (rect.width < 1 || rect.height < 1) return;

      const scale = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
      // Resolve each 8x16 font pixel row to an integer number of display pixels.
      // The 320x240 standard raster uses a six-pixel beam cadence; high mode
      // keeps its two-pixel cadence while using a larger source raster.
      const scanPitch = activeVideoMode.deviceScale;
      activeScanPitchCss = scanPitch / scale;
      screenOriginY = rect.top;
      const width = Math.max(1, Math.round(rect.width * scale));
      const height = Math.max(1, Math.round(rect.height * scale));
      display.width = width;
      display.height = height;
      if (!framebufferContext) {
        terminal.dataset.renderer = "dom";
        return;
      }

      framebuffer.width = width;
      framebuffer.height = height;
      framebufferContext.setTransform(scale, 0, 0, scale, -rect.left * scale, -rect.top * scale);
      drawElement(terminal);
      if (version !== renderVersion || !gl || !program) return;

      try {
        gl.viewport(0, 0, width, height);
        gl.useProgram(program);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, framebuffer);
        gl.uniform2f(gl.getUniformLocation(program, "u_resolution"), width, height);
        gl.uniform1f(gl.getUniformLocation(program, "u_scan_pitch"), scanPitch);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        terminal.dataset.renderer = "webgl2";
      } catch (error) {
        console.error("LineBoy CRT frame render failed:", error);
        terminal.dataset.renderer = "dom";
      }
    }

    function drawElement(element) {
      if (!(element instanceof Element) || element === display) return;
      const style = getComputedStyle(element);
      if (style.display === "none" || style.visibility === "hidden") return;
      const bounds = element.getBoundingClientRect();
      if (bounds.width <= 0 || bounds.height <= 0) return;

      const ctx = framebufferContext;
      const x = bounds.left;
      const y = bounds.top;
      const displayScale = activeVideoMode.scale;
      ctx.save();
      const opacity = element.parentElement === terminal ? 1 : Number(style.opacity);
      ctx.globalAlpha *= Number.isFinite(opacity) ? opacity : 1;

      if (style.backgroundColor !== "rgba(0, 0, 0, 0)" && style.backgroundColor !== "transparent") {
        ctx.fillStyle = style.backgroundColor;
        ctx.fillRect(x, y, bounds.width, bounds.height);
      }

      const sides = ["Top", "Right", "Bottom", "Left"];
      for (const side of sides) {
        const borderWidth = (Number.parseFloat(style[`border${side}Width`]) || 0) * displayScale;
        if (!borderWidth || style[`border${side}Style`] === "none") continue;
        ctx.fillStyle = style[`border${side}Color`];
        if (side === "Top") ctx.fillRect(x, y, bounds.width, borderWidth);
        if (side === "Right") ctx.fillRect(x + bounds.width - borderWidth, y, borderWidth, bounds.height);
        if (side === "Bottom") ctx.fillRect(x, y + bounds.height - borderWidth, bounds.width, borderWidth);
        if (side === "Left") ctx.fillRect(x, y, borderWidth, bounds.height);
      }

      if (style.boxShadow.includes("inset 0 1px")) {
        ctx.fillStyle = "#eeeeee";
        ctx.fillRect(x + displayScale, y + displayScale,
          Math.max(0, bounds.width - 2 * displayScale), displayScale);
        ctx.fillStyle = "#777777";
        ctx.fillRect(x + displayScale, y + bounds.height - 2 * displayScale,
          Math.max(0, bounds.width - 2 * displayScale), displayScale);
      }

      ctx.save();
      if (element !== terminal && /(auto|scroll|hidden|clip)/.test(`${style.overflowX} ${style.overflowY}`)) {
        ctx.beginPath();
        ctx.rect(x + element.clientLeft * displayScale, y + element.clientTop * displayScale,
          element.clientWidth * displayScale, element.clientHeight * displayScale);
        ctx.clip();
      }

      for (const child of element.childNodes) {
        if (child.nodeType === Node.TEXT_NODE) drawText(child);
        else if (child.nodeType === Node.ELEMENT_NODE) drawElement(child);
      }
      ctx.restore();
      ctx.restore();
    }

    function drawText(node) {
      const raw = node.textContent || "";
      if (!raw.trim() || !node.parentElement) return;
      const style = getComputedStyle(node.parentElement);
      if (style.visibility === "hidden" || style.display === "none") return;
      const text = style.textTransform === "uppercase" ? raw.toUpperCase()
        : style.textTransform === "lowercase" ? raw.toLowerCase()
        : raw;
      const range = document.createRange();
      range.selectNodeContents(node);
      const boxes = [...range.getClientRects()];
      if (!boxes.length) return;

      const ctx = framebufferContext;
      ctx.save();
      ctx.fillStyle = style.color;
      const fontSize = Number.parseFloat(style.fontSize) * activeVideoMode.scale;
      ctx.font = `${style.fontWeight} ${fontSize}px ${style.fontFamily}`;
      ctx.textBaseline = "alphabetic";
      if ("letterSpacing" in ctx) {
        const letterSpacing = Number.parseFloat(style.letterSpacing);
        ctx.letterSpacing = `${Number.isFinite(letterSpacing)
          ? letterSpacing * activeVideoMode.scale : 0}px`;
      }
      for (const box of boxes) {
        const metrics = ctx.measureText(text);
        const ascent = metrics.actualBoundingBoxAscent || fontSize * 0.8;
        const descent = metrics.actualBoundingBoxDescent || fontSize * 0.2;
        const measuredBaseline = box.top + box.height / 2 + (ascent - descent) / 2;
        const glyphTop = measuredBaseline - ascent;
        const snappedGlyphTop = screenOriginY
          + Math.round((glyphTop - screenOriginY) / activeScanPitchCss) * activeScanPitchCss;
        const baseline = snappedGlyphTop + ascent;
        ctx.fillText(text, box.left, baseline);
      }
      ctx.restore();
    }

    if (gl && program) {
      document.fonts.ready.then(scheduleRender);
      new ResizeObserver(scheduleRender).observe(terminal);
      window.addEventListener("resize", () => {
        updateVideoMode();
        scheduleRender();
      });
      document.addEventListener("scroll", scheduleRender, true);
      terminal.addEventListener("pointerover", scheduleRender);
      terminal.addEventListener("pointerout", scheduleRender);
      terminal.addEventListener("focusin", scheduleRender);
      terminal.addEventListener("focusout", scheduleRender);
      new MutationObserver(scheduleRender).observe(terminal, {
        attributes: true,
        attributeFilter: ["aria-selected", "aria-pressed"],
        characterData: true,
        childList: true,
        subtree: true,
      });
    }

    const songs = [...document.querySelectorAll(".song")];
    const status = document.querySelector("#status");
    const now = document.querySelector("#now");
    const clock = document.querySelector("#clock");
    let seconds = 0;
    setInterval(() => {
      seconds += 1;
      clock.textContent = new Date(seconds * 1000).toISOString().slice(11, 19);
      scheduleRender();
    }, 1000);

    songs.forEach((song) => song.addEventListener("click", () => {
      songs.forEach((entry) => entry.setAttribute("aria-selected", "false"));
      song.setAttribute("aria-selected", "true");
      const title = song.children[1].textContent;
      now.textContent = "STOPPED";
      status.textContent = `C:\\SNES\\CHRONO\\${title.toUpperCase().replaceAll(" ", "_")}.SPC`;
    }));

    document.querySelectorAll(".tree-row").forEach((row) => row.addEventListener("click", () => {
      document.querySelectorAll(".tree-row").forEach((entry) => entry.setAttribute("aria-selected", "false"));
      row.setAttribute("aria-selected", "true");
    }));

    document.querySelectorAll(".key").forEach((key) => key.addEventListener("click", () => {
      document.querySelectorAll(".key").forEach((entry) => entry.setAttribute("aria-pressed", "false"));
      key.setAttribute("aria-pressed", "true");
      const action = key.dataset.action;
      if (action === "PLAY") now.textContent = "PLAYING";
      else if (action === "PREV") {
        now.textContent = "PREVIOUS";
        status.textContent = "C:\\SNES\\CHRONO\\BLACKBIRD_INSIDE.SPC";
      } else if (action === "NEXT") {
        now.textContent = "NEXT";
        status.textContent = "C:\\SNES\\CHRONO\\BOSS_BATTLE_1.SPC";
      } else now.textContent = `MOCK ${action}`;
    }));
  </script>
