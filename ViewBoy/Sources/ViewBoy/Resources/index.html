<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>ViewBoy</title>
    <script>
      try {
        const options = JSON.parse(localStorage.getItem("ViewBoy.displayOptions") || "{}");
        const surfaces = {
          GAMEBOY: "#9BBC0F",
          NIGHTBOY: "#000000",
          PURPLEBOY: "#29252E",
          IDIGLOWBOY: "#78D7D4",
          DARKPURPLEBOY: "#704883",
        };
        const theme = Object.hasOwn(surfaces, options.theme) || options.theme === "CUSTOM"
          ? options.theme : "GAMEBOY";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.setProperty("--screen-surface",
          theme === "CUSTOM" && CSS.supports("color", options.customBackgroundColor)
            ? options.customBackgroundColor : surfaces[theme] || "#9BBC0F");
      } catch {}
    </script>
    <link rel="stylesheet" href="./yoga-screen.css" />
  </head>
  <body>
    <main id="screen-window" aria-label="ViewBoy">
      <canvas id="lcd" width="320" height="200" tabindex="0" aria-label="ViewBoy library and playback screen"></canvas>
    </main>
    <div id="screen-reader-status" class="sr-only" aria-live="polite"></div>
    <script>
      import("./yoga-app.js").catch((error) => {
        const message = error?.message || String(error);
        document.title = `ViewBoy — ${message}`;
        document.querySelector("#screen-reader-status").textContent = `Screen startup failed: ${message}`;
      });
    </script>
  </body>
</html>
