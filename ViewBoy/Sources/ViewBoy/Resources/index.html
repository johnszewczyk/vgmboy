<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>ViewBoy</title>
    <script>
      try {
        const options = JSON.parse(localStorage.getItem("ViewBoy.displayOptions") || "{}");
        const hasCustomPalette = options.customPaletteConfigured === true
          || options.customColorsInitialized === true;
        const background = hasCustomPalette && CSS.supports("color", options.customBackgroundColor)
          ? options.customBackgroundColor : "#9BBC0F";
        document.documentElement.style.setProperty("--screen-surface", background);
      } catch {}
    </script>
    <link rel="stylesheet" href="./yoga-screen.css" />
  </head>
  <body>
    <main id="screen-window" aria-label="ViewBoy">
      <canvas id="lcd" width="320" height="200" tabindex="0" aria-label="ViewBoy library and playback screen"></canvas>
    </main>
    <div id="screen-reader-status" class="sr-only" aria-live="polite"></div>
    <script>
      import("./yoga-app.js").catch((error) => {
        const message = error?.message || String(error);
        document.title = `ViewBoy — ${message}`;
        document.querySelector("#screen-reader-status").textContent = `Screen startup failed: ${message}`;
      });
    </script>
  </body>
</html>
