<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>VGMManDocs</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">V</div>
          <div class="brand-copy"><strong>VGMManDocs</strong><span>Project library</span></div>
        </div>
        <div class="sidebar-tools">
          <label class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="search" type="search" placeholder="Filter documents" autocomplete="off" />
            <kbd>⌘K</kbd>
          </label>
          <button id="new-document" class="icon-button" type="button" title="New document" aria-label="New document">＋</button>
        </div>
        <div id="tree" class="tree" role="tree" aria-label="Documentation"></div>
        <div class="sidebar-footer"><span class="live-dot"></span><span id="source-label">Watching Docs/md</span></div>
      </aside>

      <main class="main-pane">
        <header class="page-toolbar">
          <div class="breadcrumbs"><span>VGMMan</span><span class="crumb-separator">/</span><span id="crumb-owner">Documentation</span></div>
          <div class="toolbar-actions">
            <span id="live-status" class="live-status">Live</span>
            <button id="edit-document" class="edit-button" type="button" disabled><span aria-hidden="true">✎</span> Edit Markdown</button>
          </div>
        </header>
        <article id="document" class="document-content" aria-live="polite">
          <div class="loading-state"><span class="spinner"></span><span>Loading documentation…</span></div>
        </article>
      </main>
    </div>

    <div id="editor-backdrop" class="editor-backdrop" aria-hidden="true"></div>
    <aside id="editor-drawer" class="editor-drawer" aria-label="Markdown editor" aria-hidden="true">
      <header class="drawer-header">
        <div><span class="drawer-eyebrow">SOURCE EDITOR</span><h2 id="editor-title">Edit Markdown</h2></div>
        <button id="close-editor" class="icon-button close-button" type="button" aria-label="Close editor">×</button>
      </header>
      <div id="editor-conflict" class="editor-conflict" role="status" hidden>
        This file changed on disk. Reload the current version before saving.
        <button id="reload-editor" type="button">Reload file</button>
      </div>
      <textarea id="markdown-source" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Markdown source"></textarea>
      <footer class="drawer-footer">
        <span id="save-status" class="save-status">Markdown source</span>
        <div class="drawer-actions">
          <button id="cancel-editor" class="quiet-button" type="button">Close</button>
          <button id="save-document" class="primary-button" type="button">Save</button>
        </div>
      </footer>
    </aside>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="marked.min.js"></script>
    <script src="markdown-renderer.js"></script>
    <script src="app.js"></script>
  </body>
</html>
