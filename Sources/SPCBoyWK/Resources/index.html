<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPCBoy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <input id="search" type="search" placeholder="Search Library" aria-label="Search Library">
    <nav class="modes" aria-label="Library view">
      <button class="mode active" data-mode="consoles">Consoles</button>
      <button class="mode" data-mode="paths">Paths</button>
    </nav>
    <div class="empty">Shared sidebar host ready</div>
  </aside>
  <main class="playlist">
    <div class="empty">WebKit frontend scaffold</div>
  </main>
  <script>
    const search = document.querySelector("#search");
    const modes = [...document.querySelectorAll(".mode")];
    search.addEventListener("input", () => {
      document.body.dataset.searching = search.value.trim() ? "true" : "false";
    });
    modes.forEach((button) => button.addEventListener("click", () => {
      modes.forEach((item) => item.classList.toggle("active", item === button));
      document.body.dataset.mode = button.dataset.mode;
    }));
  </script>
</body>
</html>
